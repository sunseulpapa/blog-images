<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>blog card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Noto+Serif+KR:wght@700;900&display=block" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#fff}
*{box-sizing:border-box}
#card{width:1000px;height:1000px;overflow:hidden;position:relative;font-family:'Noto Sans KR','Noto Sans CJK KR',sans-serif;word-break:keep-all}
#status{position:absolute;top:1100px;left:0;font:16px monospace;white-space:pre}
.abs{position:absolute}
.fit{overflow:hidden}
/* ---------- 생활가이드 ---------- */
.g{background:#FAF6EE;width:1000px;height:1000px;position:relative;color:#2B2B2B}
.g .head{background:#1E5A57;padding:62px 70px 0;height:330px}
.g .badge{display:inline-block;background:#F4C24D;color:#1E5A57;font-weight:900;font-size:28px;line-height:1.4;padding:8px 24px;border-radius:30px;max-width:860px;white-space:nowrap;overflow:hidden}
.g .title{color:#FAF6EE;font-weight:900;font-size:72px;line-height:1.18;letter-spacing:-2px;margin-top:20px;height:190px}
.g .foot{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-weight:700;font-size:24px;color:#1E5A57;display:flex;justify-content:center;align-items:center;gap:8px}
.g .body{position:absolute;left:70px;right:70px;top:366px;bottom:96px;display:flex;flex-direction:column;gap:22px}
.g .box{background:#fff;border:4px solid #1E5A57;border-radius:26px;display:flex;align-items:center;gap:24px;padding:0 30px;flex:1;min-height:0}
.g .num{flex:none;width:62px;height:62px;border-radius:50%;background:#F4C24D;color:#1E5A57;font-weight:900;font-size:34px;display:flex;align-items:center;justify-content:center}
.g .txt{font-weight:800;font-size:36px;line-height:1.3;color:#1E2E2D;flex:1;max-height:100%}
.g .sub{font-weight:700;font-size:26px;color:#4A4A4A;margin-top:6px}
.g table{border-collapse:separate;border-spacing:0;width:100%;height:100%;background:#fff;border:4px solid #1E5A57;border-radius:26px;overflow:hidden;table-layout:fixed}
.g th{background:#1E5A57;color:#FAF6EE;font-weight:900;font-size:28px;padding:14px 12px}
.g td{font-weight:700;font-size:27px;padding:10px 12px;text-align:center;border-top:2px solid #DCEBE8;line-height:1.25}
.g td:first-child{font-weight:900;color:#1E5A57}
.g tr:nth-child(even) td{background:#F3F8F7}
.g .tdin{max-height:100%;overflow:hidden}
.g .tag{background:#F4C24D;color:#1E5A57;border-radius:22px;padding:18px 28px;font-weight:900;font-size:32px;line-height:1.3;flex:none}
.g .lab{flex:none;width:150px;font-weight:900;font-size:30px;color:#1E5A57}
.g .val{font-weight:700;font-size:30px;line-height:1.3;flex:1}
.g .ck{flex:none;width:52px;height:52px;border:4px solid #1E5A57;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center}
.g .tiles{display:flex;gap:22px;flex:1}
.g .tile{flex:1;min-width:0;background:#fff;border:4px solid #1E5A57;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:14px}
.g .big{font-weight:900;color:#1E5A57;font-size:72px;line-height:1.3;letter-spacing:-2px;white-space:nowrap;width:100%}
.g .tl{font-weight:800;font-size:28px;line-height:1.3;width:100%;max-height:120px}
.g .note{background:#F4C24D33;border-radius:20px;padding:18px 26px;font-weight:700;font-size:26px;line-height:1.35;flex:none}
.g .tlrow{display:flex;align-items:center;gap:26px;flex:1;min-height:0;position:relative}
.g .date{flex:none;width:220px;background:#1E5A57;color:#FAF6EE;border-radius:22px;padding:14px 10px;text-align:center;font-weight:900;font-size:30px;position:relative;z-index:1}
.g .line{position:absolute;left:110px;top:30px;bottom:30px;width:6px;background:#F4C24D;border-radius:3px}
.g.cover{background:#1E5A57}
.g.cover .ctitle{position:absolute;left:70px;right:70px;top:160px;height:330px;color:#FAF6EE;font-weight:900;font-size:96px;line-height:1.14;letter-spacing:-3px}
.g.cover .csub{position:absolute;left:70px;right:420px;top:520px;height:180px;color:#CFE3DF;font-weight:700;font-size:34px;line-height:1.4}
.g.cover .cicon{position:absolute;right:70px;bottom:120px;width:330px;height:330px;border-radius:50%;background:#F4C24D;display:flex;align-items:center;justify-content:center}
.g.cover .foot{color:#F4C24D}
/* ---------- 윤슬 ---------- */
.y{width:1000px;height:1000px;position:relative}
.y svg{position:absolute;left:0;top:0}
</style></head>
<body><div id="card"></div><div id="status">STATUS_LOADING</div>
<script>
'use strict';
const SANS = "'Noto Sans KR','Noto Sans CJK KR',sans-serif";
const SERIF = "'Noto Serif KR','Noto Serif CJK KR',serif";
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const br = s => esc(s).replace(/\s*\|\s*/g,'<br>').replace(/\n/g,'<br>');
const arr = (a, n) => (Array.isArray(a) ? a : []).slice(0, n);

/* ================= 생활가이드 아이콘 (24 그리드) ================= */
const GI = {
  pin:'<path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z" fill="#F4C24D"/><circle cx="12" cy="10" r="2.6"/>',
  clock:'<circle cx="12" cy="12" r="9" fill="#F4C24D"/><path d="M12 7v5l3 2"/>',
  park:'<rect x="4" y="3" width="16" height="18" rx="3" fill="#F4C24D"/><path d="M10 17V7h3a3 3 0 0 1 0 6h-3"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8z" fill="#F4C24D"/><circle cx="7.5" cy="8.5" r="1.5"/>',
  phone:'<path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z" fill="#F4C24D"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2" fill="#F4C24D"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 15l2.5 2.5L16 13"/>',
  coin:'<circle cx="12" cy="12" r="9" fill="#F4C24D"/><path d="M9 9l1.5 6L12 10l1.5 5L15 9M8 12h8"/>',
  car:'<path d="M3 16v-4l2-5h14l2 5v4z" fill="#F4C24D"/><path d="M3 12h18"/><circle cx="7.5" cy="16.5" r="2"/><circle cx="16.5" cy="16.5" r="2"/>',
  cup:'<path d="M4 8h13v6a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z" fill="#F4C24D"/><path d="M17 10h2a2 2 0 0 1 0 4h-2M8 3v2M12 3v2"/>',
  food:'<path d="M3 12h18a9 9 0 0 1-18 0z" fill="#F4C24D"/><path d="M7 8c0-2 2-2 2-4M12 8c0-2 2-2 2-4M2 21h20"/>',
  book:'<path d="M4 4h7a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4z" fill="#F4C24D"/><path d="M20 4h-7a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h7z"/>',
  gym:'<path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/><rect x="5" y="7" width="2" height="10" fill="#F4C24D"/><rect x="17" y="7" width="2" height="10" fill="#F4C24D"/>',
  game:'<rect x="2" y="7" width="20" height="11" rx="5" fill="#F4C24D"/><path d="M7 11v3M5.5 12.5h3"/><circle cx="16" cy="11.5" r="1"/><circle cx="18" cy="13.5" r="1"/>',
  ball:'<circle cx="12" cy="12" r="9" fill="#F4C24D"/><circle cx="10" cy="9" r="1"/><circle cx="14" cy="9" r="1"/><circle cx="12" cy="12" r="1"/>',
  scissors:'<circle cx="6" cy="6" r="3" fill="#F4C24D"/><circle cx="6" cy="18" r="3" fill="#F4C24D"/><path d="M8.5 7.5L20 18M8.5 16.5L20 6"/>',
  shirt:'<path d="M8 3l-5 3 2 5 3-1v11h8V10l3 1 2-5-5-3a4 4 0 0 1-8 0z" fill="#F4C24D"/>',
  home:'<path d="M3 11l9-8 9 8v10H3z" fill="#F4C24D"/><path d="M9 21v-6h6v6"/>',
  bus:'<rect x="4" y="3" width="16" height="15" rx="3" fill="#F4C24D"/><path d="M4 11h16M8 21v-3M16 21v-3"/><circle cx="8" cy="14.5" r="1"/><circle cx="16" cy="14.5" r="1"/>',
  snow:'<path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/><circle cx="12" cy="12" r="3" fill="#F4C24D"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="2" fill="#F4C24D"/><path d="M2 10h20M6 15h4"/>',
  store:'<path d="M3 9l2-5h14l2 5z" fill="#F4C24D"/><path d="M4 9v11h16V9M9 20v-6h6v6"/>',
  kid:'<circle cx="12" cy="7" r="4" fill="#F4C24D"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>',
  info:'<circle cx="12" cy="12" r="9" fill="#F4C24D"/><path d="M12 11v6M12 7.5v.5"/>',
  check:'<path d="M5 12l5 5L20 7"/>',
  star:'<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.3L12 17.5 6.5 20.4l1-6.3L3 9.7l6.2-.9z" fill="#F4C24D"/>',
  leaf:'<path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15z" fill="#F4C24D"/><path d="M5 19l8-8"/>',
};
const gicon = (name, size, stroke='#1E5A57', sw=2) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${GI[name] || GI.info}</svg>`;
const labelIcon = l => /위치|주소|장소/.test(l) ? 'pin' : /시간|영업|운영/.test(l) ? 'clock' : /주차/.test(l) ? 'park'
  : /가격|요금|비용|금액/.test(l) ? 'tag' : /전화|문의|연락/.test(l) ? 'phone' : /예약|일정|날짜/.test(l) ? 'cal' : 'info';
const gfoot = (c) => `<div class="foot" ${c?`style="color:${c}"`:''}>${gicon('pin',28,c||'#1E5A57',2.2)}동탄수원 생활가이드</div>`;
const ghead = s => `<div class="head"><div class="badge fit">${esc(s.badge||'동탄수원 생활가이드')}</div><div class="title fit" data-min="44"><span>${br(s.title)}</span></div></div>`;

const G = {
  cover(s){ return `<div class="g cover"><div class="abs" style="left:70px;top:70px"><span class="badge" style="display:inline-block;background:#F4C24D;color:#1E5A57;font-weight:900;font-size:30px;padding:8px 26px;border-radius:30px">${esc(s.badge||'동탄수원 생활가이드')}</span></div>
    <div class="ctitle fit" data-min="56">${br(s.title)}</div><div class="csub fit" data-min="24">${br(s.sub||'')}</div>
    <div class="cicon">${gicon(s.icon||'pin',200,'#1E5A57',1.6)}</div>${gfoot('#F4C24D')}</div>`; },
  summary(s){ const L = arr(s.lines,4); return `<div class="g">${ghead(s)}<div class="body">${L.map((t,i)=>`<div class="box"><div class="num">${i+1}</div><div class="txt fit" data-min="24">${br(t)}</div></div>`).join('')}</div>${gfoot()}</div>`; },
  check(s){ const L = arr(s.items,6); return `<div class="g">${ghead(s)}<div class="body" style="gap:${L.length>4?16:22}px">${L.map(t=>`<div class="box"><div class="ck">${gicon('check',40,'#F4C24D',3.4)}</div><div class="txt fit" data-min="22">${br(t)}</div></div>`).join('')}</div>${gfoot()}</div>`; },
  table(s){ const C = arr(s.cols,4), R = arr(s.rows,6); const w = C.length? (C.length===2?[40,60]:C.length===3?[30,35,35]:[25,25,25,25]):[];
    return `<div class="g">${ghead(s)}<div class="body"><table><colgroup>${w.map(x=>`<col style="width:${x}%">`).join('')}</colgroup><thead><tr>${C.map(c=>`<th><div class="fit tdin" data-min="18">${br(c)}</div></th>`).join('')}</tr></thead><tbody>${R.map(r=>`<tr>${C.map((_,j)=>`<td><div class="fit tdin" data-min="17">${br((r||[])[j]??'')}</div></td>`).join('')}</tr>`).join('')}</tbody></table></div>${gfoot()}</div>`; },
  store(s){ const I = arr(s.info,5); return `<div class="g">${ghead({badge:s.badge||'매장 정보',title:s.name})}<div class="body" style="gap:16px">${s.tag?`<div class="tag fit" data-min="22">${br(s.tag)}</div>`:''}${I.map(p=>`<div class="box" style="gap:18px">${gicon(labelIcon(p[0]||''),54,'#1E5A57',2)}<div class="lab fit" data-min="20">${esc(p[0])}</div><div class="val fit" data-min="20">${br(p[1])}</div></div>`).join('')}</div>${gfoot()}</div>`; },
  numbers(s){ const N = arr(s.nums,3); return `<div class="g">${ghead(s)}<div class="body"><div class="tiles">${N.map(n=>`<div class="tile">${n[2]?gicon(n[2],84,'#1E5A57',1.8):''}<div class="big fit" data-min="34">${esc(n[0])}</div><div class="tl fit" data-min="20">${br(n[1])}</div></div>`).join('')}</div>${s.note?`<div class="note fit" data-min="20">${br(s.note)}</div>`:''}</div>${gfoot()}</div>`; },
  schedule(s){ const S = arr(s.steps,5); return `<div class="g">${ghead(s)}<div class="body" style="gap:14px"><div class="line"></div>${S.map(p=>`<div class="tlrow"><div class="date fit" data-min="20">${br(p[0])}</div><div class="txt fit" data-min="22" style="font-size:32px">${br(p[1])}</div></div>`).join('')}</div>${gfoot()}</div>`; },
};

/* ================= 윤슬 ================= */
const YT = {
  sage:   {b1:'#DDE8DA', b2:'#CBDCC6', ink:'#2F4A3A', acc:'#7FA68C', chip:'#E4EEE0', sh:'#A9C2A3'},
  ivory:  {b1:'#F6F0E6', b2:'#EADFCB', ink:'#5A4636', acc:'#B58E6A', chip:'#F3EADB', sh:'#D6C4A6'},
  navy:   {b1:'#E7ECF3', b2:'#D6DEEA', ink:'#22324A', acc:'#6F87A8', chip:'#E3E9F2', sh:'#B5C3D6'},
  apricot:{b1:'#FBE9DF', b2:'#F6D6C6', ink:'#7A3E2E', acc:'#E39A7E', chip:'#FBE4D8', sh:'#EBBBA6'},
};
const YRED = '#D0604F', YSKIN = '#F6E3D3';
const yperson = (cx, top, sc, T, opt={}) => { // 정면 증명사진 인물. top = 정수리 y, sc = 1이면 얼굴 높이 238
  const g = (x,y)=>`${cx+x*sc},${top+y*sc}`; const f = n => n*sc; const tilt = opt.tilt||0;
  return `<g transform="rotate(${tilt} ${cx} ${top+f(150)})">
  <path d="M${g(-108,330)} C${g(-108,270)} ${g(-68,250)} ${g(0,250)} C${g(68,250)} ${g(108,270)} ${g(108,330)} Z" fill="${T.acc}" stroke="${T.ink}" stroke-width="${f(5)}"/>
  <path d="M${g(-32,252)} L${g(0,286)} L${g(32,252)}" fill="#fff" stroke="${T.ink}" stroke-width="${f(4.5)}" stroke-linejoin="round"/>
  <rect x="${cx-f(18)}" y="${top+f(218)}" width="${f(36)}" height="${f(40)}" fill="${YSKIN}" stroke="${T.ink}" stroke-width="${f(4.5)}"/>
  <ellipse cx="${cx-f(92)}" cy="${top+f(126)}" rx="${f(15)}" ry="${f(21)}" fill="${YSKIN}" stroke="${T.ink}" stroke-width="${f(4.5)}"/>
  <ellipse cx="${cx+f(92)}" cy="${top+f(126)}" rx="${f(15)}" ry="${f(21)}" fill="${YSKIN}" stroke="${T.ink}" stroke-width="${f(4.5)}"/>
  <ellipse cx="${cx}" cy="${top+f(122)}" rx="${f(92)}" ry="${f(116)}" fill="${YSKIN}" stroke="${T.ink}" stroke-width="${f(5)}"/>
  <path d="M${g(-94,108)} C${g(-104,32)} ${g(-60,0)} ${g(0,0)} C${g(66,0)} ${g(106,36)} ${g(94,108)} C${g(88,74)} ${g(66,56)} ${g(32,54)} C${g(16,70)} ${g(-30,74)} ${g(-60,62)} C${g(-76,74)} ${g(-88,88)} ${g(-94,108)} Z" fill="#3B3B3B"/>
  <path d="M${g(-48,100)} Q${g(-33,94)} ${g(-18,100)} M${g(18,100)} Q${g(33,94)} ${g(48,100)}" fill="none" stroke="${T.ink}" stroke-width="${f(4)}" stroke-linecap="round"/>
  <ellipse cx="${cx-f(33)}" cy="${top+f(126)}" rx="${f(7)}" ry="${f(8)}" fill="${T.ink}"/><ellipse cx="${cx+f(33)}" cy="${top+f(126)}" rx="${f(7)}" ry="${f(8)}" fill="${T.ink}"/>
  <circle cx="${cx-f(30.5)}" cy="${top+f(123)}" r="${f(2.2)}" fill="#fff"/><circle cx="${cx+f(35.5)}" cy="${top+f(123)}" r="${f(2.2)}" fill="#fff"/>
  <ellipse cx="${cx-f(58)}" cy="${top+f(162)}" rx="${f(14)}" ry="${f(8)}" fill="#F2B9A8" opacity=".7"/><ellipse cx="${cx+f(58)}" cy="${top+f(162)}" rx="${f(14)}" ry="${f(8)}" fill="#F2B9A8" opacity=".7"/>
  ${opt.smile===false ? `<path d="M${g(-10,184)} L${g(10,184)}" stroke="${T.ink}" stroke-width="${f(4.5)}" stroke-linecap="round"/>`
     : `<path d="M${g(-12,182)} Q${g(0,188)} ${g(12,182)}" fill="none" stroke="${T.ink}" stroke-width="${f(4.5)}" stroke-linecap="round"/>`}
  </g>`; };
const ybg = T => `<rect width="1000" height="1000" fill="${T.b1}"/><path d="M1000 0 L1000 1000 L0 1000 Z" fill="${T.b2}"/>`;
const yhead = (s,T,titleY=196) => `<rect x="${500-Math.max(120, (s.badge||'증명사진 가이드').length*13+40)}" y="58" width="${2*Math.max(120,(s.badge||'증명사진 가이드').length*13+40)}" height="48" rx="24" fill="${T.ink}"/>
  <text x="500" y="91" text-anchor="middle" font-family="${SANS}" font-weight="700" font-size="23" fill="${T.b1}" letter-spacing="1">${esc(s.badge||'증명사진 가이드')}</text>
  <text class="sfit" data-max="880" x="500" y="${titleY}" text-anchor="middle" font-family="${SANS}" font-weight="900" font-size="76" fill="${T.ink}" letter-spacing="-2">${esc(s.title)}</text>`;
const yfoot = T => `<text x="500" y="962" text-anchor="middle" font-family="${SANS}" font-weight="700" font-size="24" fill="${T.ink}">사진관, 윤슬</text>`;
const YI = { // 칩 아이콘 (중심 0,0)
  bg:'<rect x="-12" y="-14" width="24" height="28" rx="3" fill="#fff"/><circle cx="0" cy="-3" r="5"/><path d="M-8 14 C-8 6 8 6 8 14"/>',
  cal:'<rect x="-13" y="-11" width="26" height="24" rx="4"/><path d="M-13 -3 H13 M-6 -15 V-8 M6 -15 V-8"/><path d="M-5 5 l3 3 6 -7"/>',
  face:'<circle cx="0" cy="0" r="13"/><circle cx="-4.5" cy="-2" r="1.2" fill="currentColor"/><circle cx="4.5" cy="-2" r="1.2" fill="currentColor"/><path d="M-5 6 H5"/>',
  clock:'<circle cx="0" cy="0" r="13"/><path d="M0 -7 V0 L5 4"/>',
  shirt:'<path d="M-6 -12 L-14 -7 L-11 0 L-7 -2 V13 H7 V-2 L11 0 L14 -7 L6 -12 A6 6 0 0 1 -6 -12 Z"/>',
  glasses:'<circle cx="-7" cy="0" r="6"/><circle cx="7" cy="0" r="6"/><path d="M-1 0 H1 M-13 -2 L-16 -5 M13 -2 L16 -5"/>',
  hair:'<path d="M-12 8 C-14 -10 14 -10 12 8"/><path d="M-6 -6 C-2 0 2 0 6 -6"/>',
  file:'<path d="M-9 -13 H4 L10 -7 V13 H-9 Z"/><path d="M-4 -2 H5 M-4 4 H5"/>',
  check:'<path d="M-8 0 L-2 6 L9 -6"/>',
};
const ychip = (x, y, w, s, T) => { const ic = s.icon || (/배경|흰/.test(s.t)?'bg':/개월|이내|기간|날짜/.test(s.t)?'cal':/정면|표정|입/.test(s.t)?'face':/옷|복장|의상/.test(s.t)?'shirt':/안경/.test(s.t)?'glasses':/머리|귀|눈썹/.test(s.t)?'hair':/분|시간/.test(s.t)?'clock':/서류|제출|원서/.test(s.t)?'file':'check');
  return `<g transform="translate(${x},${y})"><rect x="0" y="4" width="${w}" height="92" rx="46" fill="${T.sh}"/><rect x="0" y="0" width="${w}" height="92" rx="46" fill="#fff"/>

const ychips = (list, y, T) => { const L = arr(list,3).map(c => typeof c === 'string' ? {t:c} : c); const n = L.length; if(!n) return '';
  const gap = 25, w = Math.floor((880 - gap*(n-1))/n); return L.map((c,i)=>ychip(60+i*(w+gap), y, w, c, T)).join(''); };
const yframe = (x,y,w,h,T,inner,id) => `<rect x="${x+8}" y="${y+10}" width="${w}" height="${h}" rx="12" fill="${T.sh}" opacity=".8"/>
  <clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12"/></clipPath>

    const X = 500 - W/2, Yp = 250, sc = W/300*0.92; const top = Yp + H*0.2, chin = top + 238*sc;
    const inner = yperson(500, top, sc, T) + (s.face ? `<line x1="${X}" y1="${top}" x2="${X+W}" y2="${top}" stroke="#E0796A" stroke-width="2.5" stroke-dasharray="8 7"/><line x1="${X}" y1="${chin}" x2="${X+W}" y2="${chin}" stroke="#E0796A" stroke-width="2.5" stroke-dasharray="8 7"/>` : '');

      const inner = yperson(x+200, fy+fh*0.2, fw/300*0.92, T, {tilt: good?0:-14, smile: good}) + (good?'':`<ellipse cx="${x+235}" cy="${fy+150}" rx="80" ry="110" fill="#555" opacity=".18"/>`);

    + ink('M576 250 H744 C753 250 760 257 760 266 V374 C760 383 753 390 744 390 H576 C567 390 560 383 560 374 V266 C560 257 567 250 576 250 Z') + ink('M560 266 L660 330 L760 266', 2)
    + wc('<path d="M660 330 C646 318 648 304 660 304 C666 304 668 308 668 311 C668 308 670 304 676 304 C688 304 690 318 676 330 L668 336 Z" fill="{c}"/>', A.rose, .9, .3)

    + `<circle cx="500" cy="352" r="82" fill="none" stroke="${A.ink}" stroke-width="2.4" opacity=".85"/><circle cx="500" cy="352" r="54" fill="none" stroke="${A.ink}" stroke-width="2" opacity=".85"/><circle cx="480" cy="332" r="12" fill="#fff" opacity=".9"/>`
    + wc('<rect x="600" y="262" width="44" height="26" rx="8" fill="{c}"/>', A.yellow, .95, .4)

    + wc('<path d="M250 300 C226 280 230 252 250 252 C260 252 266 260 266 266 C266 260 272 252 282 252 C302 252 306 280 282 300 L266 314 Z" fill="{c}"/>', A.rose, .85, .4) + dots([[760,420,8],[260,420,7]], A.sky),

const heroOf = name => (HERO[name] || HERO.babyfood)();
const apage = body => `<svg width="1000" height="1000" viewBox="0 0 1000 1000"><defs>${WC_DEFS}</defs><rect width="1000" height="1000" fill="${A.paper}"/>${body}<rect width="1000" height="1000" filter="url(#paper)"/></svg>`;
const atitle = (s, y=112) => `<text class="sfit" data-max="900" x="500" y="${y}" text-anchor="middle" font-family="${SERIF}" font-weight="700" font-size="64" fill="${A.ink}">${esc(s.title)}</text>`
  + (s.sub ? `<text class="sfit" data-max="880" x="500" y="${y+50}" text-anchor="middle" font-family="${SANS}" font-weight="400" font-size="24" fill="${A.sub}">${esc(s.sub)}</text>` : '');
const ACOL = [A.pink, A.sky, A.yellow, A.green, A.apricot, A.lilac];
const arow = (y, n, t, d, c) => wc(`<circle cx="150" cy="${y}" r="34" fill="{c}"/>`, c, .85, .5)
  + `<text x="150" y="${y+12}" text-anchor="middle" font-family="${SERIF}" font-weight="700" font-size="34" fill="${A.ink}">${esc(n)}</text>`
  + `<text class="sfit" data-max="760" x="210" y="${y-2}" font-family="${SANS}" font-weight="800" font-size="31" fill="${A.ink}">${esc(t)}</text>`
  + (d ? `<text class="sfit" data-max="760" x="210" y="${y+34}" font-family="${SANS}" font-weight="400" font-size="22" fill="${A.sub}">${esc(d)}</text>` : '');
const AR = {
  list(s){ const L = arr(s.items,4); const step = L.length<=3 ? 120 : 104; const y0 = L.length<=3 ? 600 : 578;
    return apage(atitle(s) + heroOf(s.hero) + `<line x1="110" y1="500" x2="890" y2="500" stroke="#E3D3C1" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>`
      + L.map((it,i)=>arow(y0+i*step, String(i+1), it[0], it[1], ACOL[i%ACOL.length])).join('')); },
  check(s){ const L = arr(s.items,6); const step = L.length>5 ? 62 : 72; const y0 = 560 + Math.round((880 - 560 - (L.length-1)*step)/2);
    return apage(atitle(s) + `<g transform="translate(150,104) scale(.7)">${heroOf(s.hero)}</g>`
      + `<line x1="110" y1="500" x2="890" y2="500" stroke="#E3D3C1" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>`
      + L.map((t,i)=>{ const y = y0+i*step; return wc(`<circle cx="190" cy="${y}" r="24" fill="{c}"/>`, ACOL[i%ACOL.length], .85, .5) + ink(`M178 ${y} l9 9 l17 -19`, 3.4)
        + `<text class="sfit" data-max="640" x="240" y="${y+11}" font-family="${SANS}" font-weight="700" font-size="30" fill="${A.ink}">${esc(t)}</text>`; }).join('')
      + (s.note ? `<text class="sfit" data-max="860" x="500" y="950" text-anchor="middle" font-family="${SANS}" font-weight="400" font-size="22" fill="${A.sub}">${esc(s.note)}</text>` : '')); },
  info(s){ return apage(atitle(s) + `<g transform="translate(0,40)">${heroOf(s.hero)}</g>`
      + wc('<ellipse cx="500" cy="680" rx="300" ry="78" fill="{c}"/>', A.yellow, .55, .25)
      + `<text class="sfit" data-max="560" x="500" y="706" text-anchor="middle" font-family="${SERIF}" font-weight="900" font-size="76" fill="${A.ink}">${esc(s.big)}</text>`
      + (s.desc ? `<text class="sfit" data-max="840" x="500" y="822" text-anchor="middle" font-family="${SANS}" font-weight="700" font-size="32" fill="${A.ink}">${esc(s.desc)}</text>` : '')
      + (s.note ? `<text class="sfit" data-max="840" x="500" y="880" text-anchor="middle" font-family="${SANS}" font-weight="400" font-size="24" fill="${A.sub}">${esc(s.note)}</text>` : '')); },
};

/* ================= 그리기 + 글자 맞춤 ================= */
function fitHtml(root){ let bad = []; root.querySelectorAll('.fit').forEach(el => { const min = +(el.dataset.min||16);
  let fs = parseFloat(getComputedStyle(el).fontSize); const over = () => el.scrollWidth > el.clientWidth + 1 || el.scrollHeight > el.clientHeight + fs*0.3;
  let guard = 80; while (over() && fs > min && guard--) { fs -= 1; el.style.fontSize = fs + 'px'; }
  if (over()) bad.push((el.textContent||'').slice(0,20)); }); return bad; }
function fitSvg(root){ let bad = []; root.querySelectorAll('text.sfit').forEach(t => { const max = +t.dataset.max; let fs = parseFloat(t.getAttribute('font-size'));
  let guard = 80; while (t.getComputedTextLength() > max && fs > 14 && guard--) { fs -= 1; t.setAttribute('font-size', fs); }
  if (t.getComputedTextLength() > max) bad.push((t.textContent||'').slice(0,20)); }); return bad; }

(async () => {
  const st = document.getElementById('status');
  try {
    const raw = decodeURIComponent(location.hash.slice(1));
    if (!raw) { st.textContent = 'STATUS_NO_DATA'; return; }
    const s = JSON.parse(raw); const k = String(s.k||''); const [kit, type] = k.split('.');
    let html;
    if (kit === 'g' && G[type]) html = G[type](s);
    else if (kit === 'y' && Y[type]) html = `<div class="y">${Y[type](s, YT[s.theme] || YT.sage)}</div>`;
    else if (kit === 'a' && AR[type]) html = AR[type](s);
    else if (kit === 'img' && s.src) html = `<div style="width:1000px;height:1000px;background:${esc(s.bg||'#fff')}"><img id="im" src="${esc(s.src)}" style="width:1000px;height:1000px;object-fit:${s.fit==='cover'?'cover':'contain'}"></div>`;
    else { st.textContent = 'STATUS_ERROR unknown k=' + k; return; }
    const card = document.getElementById('card'); card.innerHTML = html;
    const text = (card.textContent || '') + '가';
    const loads = [];
    for (const w of [400,500,700,800,900]) loads.push(document.fonts.load(`${w} 40px "Noto Sans KR"`, text).catch(()=>{}));
    for (const w of [700,900]) loads.push(document.fonts.load(`${w} 40px "Noto Serif KR"`, text).catch(()=>{}));
    await Promise.all(loads); await document.fonts.ready;
    const im = document.getElementById('im');
    if (im) { await new Promise(r => { if (im.complete) r(); else { im.onload = r; im.onerror = r; } }); if (!im.naturalWidth) { st.textContent = 'STATUS_ERROR image not loaded'; return; } }
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const bad = fitHtml(card).concat(fitSvg(card));
    const web = document.fonts.check('900 40px "Noto Sans KR"', '가');
    st.textContent = (bad.length ? 'STATUS_OVERFLOW ' + bad.join(' / ') : 'STATUS_OK') + ` k=${k} webfont=${web ? 'yes' : 'no'} title=${(s.title||s.name||'').slice(0,30)}`;
  } catch (e) { st.textContent = 'STATUS_ERROR ' + e; }
})();
